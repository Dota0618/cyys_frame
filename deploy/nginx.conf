worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 21m;
    # Docker DNS：api 重建换 IP 后重新解析，不能一直使用启动时的旧地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name _;
        return 308 https://$host$request_uri;
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        error_page 413 = @too_large;
        location = /api {
            default_type application/json;
            return 404 '{"code":404,"msg":"接口不存在"}';
        }
        location ^~ /api/ {
            set $api http://api:8080;
            proxy_pass $api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
            proxy_intercept_errors off;
            # 本 location 自己定义 error_page 后不会继承 server 的 413。
            error_page 413 = @too_large;
            error_page 502 503 504 = @api_unavailable;
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"code":503,"msg":"服务暂不可用，请稍后重试"}';
        }
        location @too_large {
            default_type application/json;
            return 413 '{"code":413,"msg":"请求体超过大小限制"}';
        }
        location ~ ^/(swagger-ui|v3/api-docs|actuator)(/|$) { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* \.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
